<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ドローン・アース</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310161c'/%3E%3Cg stroke='%235fd0e6' stroke-width='5' fill='none'%3E%3Cpath d='M20 20L44 44M44 20L20 44'/%3E%3Ccircle cx='17' cy='17' r='9'/%3E%3Ccircle cx='47' cy='17' r='9'/%3E%3Ccircle cx='17' cy='47' r='9'/%3E%3Ccircle cx='47' cy='47' r='9'/%3E%3C/g%3E%3Crect x='25' y='25' width='14' height='14' rx='4' fill='%235fd0e6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.122.0/Build/Cesium/Widgets/widgets.css">
<script src="https://cdn.jsdelivr.net/npm/cesium@1.122.0/Build/Cesium/Cesium.js"></script>
<style>
  /* 全画面の3D地図の上に、計器風の操作盤を重ねる */
  :root {
    --panel: rgba(16, 22, 28, 0.78);
    --panel-solid: #10161c;
    --line: rgba(160, 200, 220, 0.28);
    --fg: #e6eef2;
    --muted: #9fb2bc;
    --accent: #5fd0e6;
    --warn: #f2b84b;
    --font: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    --mono: "SFMono-Regular", Consolas, "Courier New", monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #000; color: var(--fg); font-family: var(--font); }
  #map { position: absolute; inset: 0; }
  .cesium-viewer-bottom { bottom: 4px; }
  .hud { position: absolute; z-index: 5; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(6px); }
  button { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #top { top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; right: 64px; display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; pointer-events: none; }
  #top > * { pointer-events: auto; }
  #searchForm { display: flex; flex: 1 1 180px; max-width: 240px; }
  #searchForm input { flex: 1; min-width: 0; height: 38px; padding: 0 12px; font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 10px 0 0 10px; }
  #searchForm button { height: 40px; border-radius: 0 10px 10px 0; padding: 0 14px; }
  .btn { height: 40px; padding: 0 12px; white-space: nowrap; }
  #gauges { margin-left: auto; padding: 8px 12px; font-family: var(--mono); font-size: 13px; line-height: 1.6; min-width: 150px; font-variant-numeric: tabular-nums; }
  #gauges b { color: var(--accent); font-weight: 500; }
  #speedBtn { font-family: var(--mono); letter-spacing: 2px; }
  #side { top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; display: flex; flex-direction: column; gap: 8px; }
  #side .btn { width: 44px; padding: 0; }
  #side svg { display: block; margin: auto; }
  #side .btn.on { border-color: var(--accent); background: rgba(95, 208, 230, 0.25); color: var(--accent); }

  #stick { left: 24px; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); width: 130px; height: 130px; border-radius: 50%; touch-action: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(95, 208, 230, 0.35); border: 1px solid var(--accent); }
  .tick { position: absolute; color: var(--muted); font-size: 12px; }
  .label { position: absolute; font-size: 12px; color: var(--muted); white-space: nowrap; text-shadow: 0 1px 2px #000; }

  #pad { right: 24px; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(2, 54px); gap: 6px; }
  #pad button { font-size: 20px; touch-action: none; user-select: none; -webkit-user-select: none; }
  #pad button.on { border-color: var(--accent); background: rgba(95, 208, 230, 0.25); }

  #tilt { left: 50%; transform: translateX(-50%); bottom: calc(28px + env(safe-area-inset-bottom, 0px)); padding: 8px 14px; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
  #tilt input { width: 140px; accent-color: var(--accent); }

  .sheet { top: calc(12px + env(safe-area-inset-top, 0px)); right: 64px; width: min(340px, calc(100vw - 76px)); box-sizing: border-box; padding: 14px; background: var(--panel-solid); font-size: 14px; }
  .sheet h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
  .sheet p { margin: 6px 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
  .sheet input[type=text], .sheet input[type=password] { width: 100%; box-sizing: border-box; height: 36px; padding: 0 10px; font: inherit; color: var(--fg); background: #1a232b; border: 1px solid var(--line); border-radius: 8px; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row button { height: 36px; padding: 0 12px; }

  #aim { left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; pointer-events: none; }
  #aim::before, #aim::after { content: ""; position: absolute; background: var(--accent); box-shadow: 0 0 2px #000; }
  #aim::before { left: 10px; top: 0; width: 2px; height: 22px; }
  #aim::after { top: 10px; left: 0; height: 2px; width: 22px; }
  #addr { left: 50%; top: calc(50% + 20px); transform: translateX(-50%); padding: 3px 10px; font-size: 13px; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
  #addr:empty { display: none; }

  #toast { left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 14px 18px; max-width: min(420px, calc(100vw - 48px)); font-size: 14px; line-height: 1.7; text-align: center; }
  #help { left: 12px; top: calc(64px + env(safe-area-inset-top, 0px)); padding: 8px 12px; font-size: 12px; color: var(--muted); line-height: 1.7; }
  @media (max-width: 700px), (pointer: coarse) { #help { display: none; } }
  @media (max-width: 700px) { .sheet { top: calc(150px + env(safe-area-inset-top, 0px)); } }
  @media (max-width: 520px) {
    #stick { width: 112px; height: 112px; left: 16px; }
    #pad { right: 16px; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(2, 46px); }
    #tilt { bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
    #tilt input { width: 110px; }
    #gauges { min-width: 0; font-size: 12px; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="top" class="hud">
  <form id="searchForm" role="search">
    <input id="q" type="text" placeholder="東京タワー、富士山 など" aria-label="場所の名前">
    <button type="submit">Go</button>
  </form>
  <button id="speedBtn" class="btn" type="button" title="速度を切り替え（Shift キーでも可）">●●○</button>
  <div id="gauges" class="panel" aria-live="off">
    高度 <b id="gAlt">---</b> m<br>
    方位 <b id="gHead">---</b><br>
    傾き <b id="gPitch">---</b>°
    <span id="gAglRow" hidden><br>対地 <b id="gAgl">---</b> m</span>
  </div>
</div>

<div id="side" class="hud">
  <button id="fsBtn" class="btn" type="button" aria-label="全画面表示" title="全画面表示"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
  <button id="locBtn" class="btn" type="button" aria-label="現在地へ移動" title="現在地へ移動"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  <button id="aglBtn" class="btn" type="button" aria-label="地面からの高さを保つ" aria-pressed="false" title="地面からの高さを保つ"><svg width="22" height="20" viewBox="0 0 24 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 20l6-8 4 4 4-6 6 10"/><path d="M2 12l6-8 4 4 4-6 6 10" stroke-dasharray="2.5 3"/></svg></button>
  <button id="setBtn" class="btn" type="button" aria-label="設定">⚙</button>
</div>

<div id="help" class="hud panel">
  W A S D：移動　← →：向き　↑ ↓：上昇・下降<br>
  Z X：カメラの傾き　Shift：速度切替
</div>

<div id="stick" class="hud panel" aria-label="移動スティック">
  <span class="tick" style="top:4px;left:50%;transform:translateX(-50%)">▲</span>
  <span class="tick" style="bottom:4px;left:50%;transform:translateX(-50%)">▼</span>
  <span class="tick" style="left:6px;top:50%;transform:translateY(-50%)">◀</span>
  <span class="tick" style="right:6px;top:50%;transform:translateY(-50%)">▶</span>
  <div id="knob"></div>
  <span class="label" style="top:-20px;left:50%;transform:translateX(-50%)">移動</span>
</div>

<div id="tilt" class="hud panel">
  <label for="pitch">見下ろす</label>
  <input id="pitch" type="range" min="-90" max="0" step="1" value="-25">
  <span>水平</span>
</div>

<div id="pad" class="hud">
  <span></span>
  <button type="button" data-act="up" aria-label="上昇">▲</button>
  <span></span>
  <button type="button" data-act="left" aria-label="左を向く">↺</button>
  <button type="button" data-act="down" aria-label="下降">▼</button>
  <button type="button" data-act="right" aria-label="右を向く">↻</button>
</div>

<div id="setSheet" class="hud panel sheet" hidden>
  <h2>API キー</h2>
  <p>Google Cloud で作った API キーを貼り付けてください。キーはこの端末のブラウザの中にだけ保存されます。</p>
  <input id="keyInput" type="password" autocomplete="off" placeholder="AIza..." aria-label="API キー">
  <div class="row">
    <button id="keySave" type="button">保存して読み込む</button>
    <button id="keyClear" type="button">削除</button>
  </div>
  <p>地図データ：Google（Map Tiles API）。地名検索・住所表示：国土地理院 地名検索API・逆ジオコーダ。</p>
</div>

<div id="aim" class="hud" aria-hidden="true"></div>
<div id="addr" class="hud panel" aria-live="polite"></div>

<div id="toast" class="hud panel" hidden></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  const KEY = "droneEarth.apiKey";

  let toastTimer;
  function toast(msg, ms) {
    const t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    if (ms) toastTimer = setTimeout(() => { t.hidden = true; }, ms);
  }

  if (typeof Cesium === "undefined") { toast("地図の部品（CesiumJS）を読み込めませんでした。インターネット接続を確認してください。"); return; }

  const viewer = new Cesium.Viewer("map", {
    baseLayer: false, baseLayerPicker: false, geocoder: false, homeButton: false,
    sceneModePicker: false, navigationHelpButton: false, animation: false, timeline: false,
    fullscreenButton: false, infoBox: false, selectionIndicator: false, globe: false
  });
  const scene = viewer.scene, camera = viewer.camera;
  scene.skyAtmosphere.show = true;
  scene.screenSpaceCameraController.enableCollisionDetection = false;

  const D = Cesium.Math.toRadians, R = Cesium.Math.toDegrees;
  camera.setView({ destination: Cesium.Cartesian3.fromDegrees(139.7671, 35.6705, 420), orientation: { heading: 0, pitch: D(-25), roll: 0 } });

  let tileset = null;
  async function loadTiles() {
    const key = store.get(KEY, "");
    if (tileset) { scene.primitives.remove(tileset); tileset = null; }
    if (!key) { toast("右上の ⚙ から API キーを登録すると、地図が表示されます。"); return; }
    toast("地図を読み込んでいます…");
    try {
      tileset = await Cesium.Cesium3DTileset.fromUrl("https://tile.googleapis.com/v1/3dtiles/root.json?key=" + encodeURIComponent(key), { showCreditsOnScreen: true });
      scene.primitives.add(tileset);
      toast("準備ができました。スティックやキーボードで飛んでみてください。", 3500);
    } catch (e) {
      toast("地図を読み込めませんでした。API キーが正しいか、Map Tiles API が有効になっているかを確認してください。（" + (e && e.message ? e.message : e) + "）");
    }
  }

  // ---- 入力の状態 ----
  const input = { fx: 0, fy: 0, up: 0, turn: 0, tilt: 0 };
  const keys = new Set();
  const speeds = [12, 45, 180]; let speedIdx = 1;
  function showSpeed() { $("speedBtn").textContent = "●".repeat(speedIdx + 1) + "○".repeat(2 - speedIdx); }
  function cycleSpeed() { speedIdx = (speedIdx + 1) % 3; showSpeed(); }
  showSpeed();
  $("speedBtn").onclick = cycleSpeed;

  const typing = () => { const a = document.activeElement; return a && (a.tagName === "INPUT" && a.type !== "range"); };
  addEventListener("keydown", (e) => {
    if (typing()) return;
    if (e.key === "Shift" && !e.repeat) cycleSpeed();
    keys.add(e.code);
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  });
  addEventListener("keyup", (e) => keys.delete(e.code));
  addEventListener("blur", () => keys.clear());

  // スティック
  const stick = $("stick"), knob = $("knob");
  let stickId = null;
  function moveKnob(e) {
    const r = stick.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2, max = r.width / 2 - 20;
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const len = Math.hypot(dx, dy);
    if (len > max) { dx *= max / len; dy *= max / len; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    input.fx = dx / max; input.fy = -dy / max;
  }
  stick.addEventListener("pointerdown", (e) => { stickId = e.pointerId; stick.setPointerCapture(e.pointerId); moveKnob(e); });
  stick.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) moveKnob(e); });
  const release = (e) => { if (e.pointerId !== stickId) return; stickId = null; knob.style.transform = ""; input.fx = input.fy = 0; };
  stick.addEventListener("pointerup", release);
  stick.addEventListener("pointercancel", release);

  // 右下のボタン（押している間だけ動く）
  const held = { up: false, down: false, left: false, right: false };
  document.querySelectorAll("#pad button").forEach((b) => {
    const act = b.dataset.act;
    const on = (e) => { e.preventDefault(); b.setPointerCapture(e.pointerId); held[act] = true; b.classList.add("on"); };
    const off = () => { held[act] = false; b.classList.remove("on"); };
    b.addEventListener("pointerdown", on);
    b.addEventListener("pointerup", off);
    b.addEventListener("pointercancel", off);
    b.addEventListener("contextmenu", (e) => e.preventDefault());
  });

  // 傾きスライダー
  const pitchEl = $("pitch");
  let pitchDeg = -25, pitchFromSlider = false;
  pitchEl.addEventListener("input", () => { pitchDeg = +pitchEl.value; pitchFromSlider = true; });

  // ---- 毎フレームの移動 ----
  const scratch = new Cesium.Matrix4(), off = new Cesium.Cartesian3(), wv = new Cesium.Cartesian3();
  let last = performance.now();
  scene.preRender.addEventListener(() => {
    const now = performance.now(), dt = Math.min((now - last) / 1000, 0.1); last = now;
    const k = (c) => keys.has(c) ? 1 : 0;
    const fwd = Cesium.Math.clamp(input.fy + k("KeyW") - k("KeyS"), -1, 1);
    const side = Cesium.Math.clamp(input.fx + k("KeyD") - k("KeyA"), -1, 1);
    const vert = (held.up ? 1 : 0) - (held.down ? 1 : 0) + k("ArrowUp") - k("ArrowDown");
    const turn = (held.right ? 1 : 0) - (held.left ? 1 : 0) + k("ArrowRight") - k("ArrowLeft");
    const tiltKey = k("KeyX") - k("KeyZ");

    const carto = camera.positionCartographic;
    let heading = camera.heading;
    if (!pitchFromSlider) pitchDeg = R(camera.pitch);
    pitchFromSlider = false;

    const following = follow && !flying;
    if (fwd || side || vert || turn || tiltKey || following || pitchDeg !== R(camera.pitch)) {
      // 高いところほど速く飛ぶ
      const v = speeds[speedIdx] * Math.max(1, carto.height / 300) * dt;
      heading += D(26.25) * turn * dt;
      pitchDeg = Cesium.Math.clamp(pitchDeg + 45 * tiltKey * dt, -89, 0);
      const e = Math.cos(heading) * side + Math.sin(heading) * fwd;
      const n = -Math.sin(heading) * side + Math.cos(heading) * fwd;
      // 対地高度維持中は ▲▼ で「保つ高さ」を変え、上下の移動はあとでまとめて行う
      if (following) aglTarget = Math.max(AGL_MIN, aglTarget + vert * v * 0.6);
      Cesium.Cartesian3.fromElements(e * v, n * v, following ? 0 : vert * v * 0.6, off);
      Cesium.Transforms.eastNorthUpToFixedFrame(camera.positionWC, Cesium.Ellipsoid.WGS84, scratch);
      Cesium.Matrix4.multiplyByPoint(scratch, off, wv);
      if (following) followGround(wv, dt);
      camera.setView({ destination: wv, orientation: { heading, pitch: D(pitchDeg), roll: 0 } });
      pitchEl.value = Math.round(pitchDeg);
    }
  });

  // ---- 対地高度維持（真下の地面・建物からの高さを保つ） ----
  const AGL_MIN = 30;
  let follow = false, flying = false, aglTarget = 0, groundH;
  const gc = new Cesium.Cartographic();
  // 真下の高さは、読み込み済みの3D地図から測る（描画の外で0.1秒おき。測れないときは undefined）
  function measureGround() {
    groundH = tileset && scene.sampleHeightSupported ? scene.sampleHeight(camera.positionCartographic) : undefined;
    return groundH;
  }
  setInterval(() => { if (follow) measureGround(); }, 100);
  function followGround(pos, dt) {
    if (groundH === undefined) return;   // 測れないうちは今の高度のまま
    const c = Cesium.Cartographic.fromCartesian(pos, Cesium.Ellipsoid.WGS84, gc);
    const diff = groundH + aglTarget - c.height;
    // 上がるのは速め、下がるのはゆっくり（急な上下を和らげる）
    c.height += diff * Math.min(1, dt * (diff > 0 ? 4 : 1.2));
    Cesium.Cartographic.toCartesian(c, Cesium.Ellipsoid.WGS84, pos);
  }
  function startFollow() {
    const gh = measureGround();
    aglTarget = Math.max(AGL_MIN, gh === undefined ? AGL_MIN : camera.positionCartographic.height - gh);
  }
  $("aglBtn").onclick = () => {
    follow = !follow;
    $("aglBtn").classList.toggle("on", follow);
    $("aglBtn").setAttribute("aria-pressed", follow);
    $("gAglRow").hidden = !follow;
    if (follow) {
      startFollow();
      toast("地面から " + Math.round(aglTarget) + " m の高さを保ちます。▲▼で高さを変えられます。", 3000);
    } else {
      toast("高さの自動調整を止めました。", 2000);
    }
  };

  // 計器
  const dirs = ["北", "北東", "東", "南東", "南", "南西", "西", "北西"];
  setInterval(() => {
    const c = camera.positionCartographic;
    const h = (R(camera.heading) + 360) % 360;
    $("gAlt").textContent = Math.round(c.height).toLocaleString();
    $("gHead").textContent = dirs[Math.round(h / 45) % 8] + " " + Math.round(h) + "°";
    $("gPitch").textContent = Math.round(R(camera.pitch));
    if (follow) $("gAgl").textContent = groundH === undefined ? "---" : Math.round(c.height - groundH).toLocaleString();
    if (document.activeElement !== pitchEl) pitchEl.value = Math.round(R(camera.pitch));
  }, 200);

  // 指定地点を少し南の上空から北向きに見下ろす位置へ飛ぶ
  function flyToPlace(lon, lat) {
    // 飛んでいる間は対地高度維持を休み、着いたらその場の高さを保ち直す
    flying = true;
    const done = () => setTimeout(() => { flying = false; if (follow) startFollow(); }, 0);
    camera.flyTo({ destination: Cesium.Cartesian3.fromDegrees(lon, lat - 0.0045, 450), orientation: { heading: 0, pitch: D(-30), roll: 0 }, duration: 3, complete: done, cancel: done });
  }

  // ---- 地名検索（国土地理院） ----
  $("searchForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = $("q").value.trim();
    if (!q) { toast("場所の名前を入れてください。", 2500); return; }
    try {
      const res = await fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q=" + encodeURIComponent(q));
      const list = await res.json();
      if (!list.length) { toast("「" + q + "」は見つかりませんでした。別の言い方でお試しください。", 3500); return; }
      const [lon, lat] = list[0].geometry.coordinates;
      flyToPlace(lon, lat);
      toast(list[0].properties.title + " へ向かいます", 2500);
      $("q").blur();
    } catch (err) {
      toast("地名検索に失敗しました。インターネット接続を確認してください。", 3500);
    }
  });

  // ---- 画面中央の地点の住所（国土地理院の逆ジオコーダ。町丁目まで） ----
  // 市区町村コード → 「東京都中央区」の対応表は、国土地理院の一覧を文字列として読むだけで実行はしない
  const muni = {};
  fetch("https://maps.gsi.go.jp/js/muni.js").then((r) => r.text()).then((t) => {
    for (const m of t.matchAll(/MUNI_ARRAY\["(\d+)"\]\s*=\s*'([^']*)'/g)) {
      const p = m[2].split(",");
      muni[m[1]] = p[1] + p[3].replace(/[\s　]/g, "");
    }
  }).catch(() => {});

  const addrEl = $("addr"), center = new Cesium.Cartesian2();
  let lastView = "", stillSince = 0, doneView = "", lastPt = null, addrSeq = 0;
  setInterval(async () => {
    const c = camera.positionCartographic;
    const view = [c.longitude, c.latitude, c.height, camera.heading, camera.pitch].map((x) => x.toFixed(6)).join();
    const now = performance.now();
    if (view !== lastView) { lastView = view; stillSince = now; return; }
    if (view === doneView || now - stillSince < 1000 || !tileset) return;

    // 止まってから1秒たったら、照準の先の地面の位置を3D地図から測る
    center.x = viewer.canvas.clientWidth / 2; center.y = viewer.canvas.clientHeight / 2;
    const pos = scene.pickPositionSupported ? scene.pickPosition(center) : undefined;
    if (!pos) { addrEl.textContent = ""; return; }   // 空を向いている・地図の読み込み中（次の回にもう一度測る）
    doneView = view;
    if (lastPt && Cesium.Cartesian3.distance(pos, lastPt) < 15) return;   // ほぼ同じ地点なら調べ直さない
    lastPt = pos;

    const g = Cesium.Cartographic.fromCartesian(pos), seq = ++addrSeq;
    try {
      const res = await fetch(`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${R(g.latitude).toFixed(6)}&lon=${R(g.longitude).toFixed(6)}`);
      const r = (await res.json()).results;
      if (seq !== addrSeq) return;   // 途中で別の地点を調べ始めていたら捨てる
      const town = r && r.lv01Nm && r.lv01Nm !== "－" ? r.lv01Nm : "";
      addrEl.textContent = r ? (muni[String(parseInt(r.muniCd, 10))] || "") + town || "住所なし" : "住所なし";
    } catch (e) {
      if (seq === addrSeq) { addrEl.textContent = ""; lastPt = null; }
    }
  }, 300);

  // ---- 現在地（位置情報はこのページの中でだけ使い、送信・保存しない） ----
  $("locBtn").onclick = () => {
    if (!navigator.geolocation) { toast("このブラウザでは現在地を使えません。", 3000); return; }
    toast("現在地を調べています…");
    navigator.geolocation.getCurrentPosition(
      (pos) => { flyToPlace(pos.coords.longitude, pos.coords.latitude); toast("現在地へ向かいます", 2500); },
      (err) => toast(err.code === 1
        ? "位置情報の利用が許可されていません。ブラウザの設定で、このサイトの位置情報を許可してください。"
        : "現在地を取得できませんでした。しばらくしてからお試しください。", 4000),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
    );
  };

  // ---- 全画面表示（対応していないブラウザではボタンを隠す） ----
  const fsBtn = $("fsBtn"), root = document.documentElement;
  if (document.fullscreenEnabled || document.webkitFullscreenEnabled) {
    fsBtn.onclick = () => {
      const p = (document.fullscreenElement || document.webkitFullscreenElement)
        ? (document.exitFullscreen || document.webkitExitFullscreen).call(document)
        : (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
      if (p && p.catch) p.catch(() => toast("全画面表示にできませんでした。", 2500));
    };
  } else {
    fsBtn.hidden = true;
  }

  // ---- シートの開閉 ----
  function toggle(sheetId) { $(sheetId).hidden = !$(sheetId).hidden; }
  $("setBtn").onclick = () => { $("keyInput").value = ""; toggle("setSheet"); };
  $("keySave").onclick = () => {
    const v = $("keyInput").value.trim();
    if (!v) { $("keyInput").placeholder = "キーを貼り付けてください"; return; }
    store.set(KEY, v); $("keyInput").value = ""; $("setSheet").hidden = true; loadTiles();
  };
  $("keyClear").onclick = () => { store.del(KEY); $("setSheet").hidden = true; loadTiles(); };

  loadTiles();
  if (!store.get(KEY, "")) $("setSheet").hidden = false;
})();
</script>
</body>
</html>
